[tox]
envlist = min-{attrs,pydantic,scrapy,extra},py{311-315},attrs,pydantic,scrapy,extra,benchmark,pre-commit,mypy,docs,twinecheck,pylint
minversion = 4.25.0

[testenv]
basepython =
    min-attrs,min-pydantic,min-scrapy,min-extra: python3.11
deps =
    pytest>=9.0
    pytest-cov>=7.0.0
    packaging
    min-attrs,min-extra: attrs==20.1.0
    min-pydantic,min-extra: pydantic==2.7
    min-scrapy,min-extra: scrapy==2.7
extras =
    min-attrs,attrs,min-extra,extra: attrs
    min-pydantic,pydantic,min-extra,extra: pydantic
    min-scrapy,scrapy,min-extra,extra: scrapy
commands =
    pytest -vv --cov=itemadapter --cov-report=term-missing --cov-report=html --cov-report=xml {posargs: itemadapter tests}

[testenv:docs]
deps =
    {[testenv]deps}
    zyte-common-items
extras =
    attrs
    pydantic
    scrapy
commands =
    pytest -vv --cov=itemadapter --cov-report=term-missing --cov-report=html --cov-report=xml --doctest-glob=README.md {posargs:README.md}

# CPU benchmarks, tracked on CodSpeed.

[testenv:benchmark]
basepython = python3.13
deps =
    pytest>=9.0
    pytest-codspeed
extras =
    attrs
    pydantic
    scrapy
passenv =
    *codspeed*
    *ci*
commands =
    pytest {posargs:tests/benchmarks} --codspeed --codspeed-mode=simulation

[testenv:mypy]
basepython = python3
deps =
    mypy==2.4.0
    attrs==26.1.0
    pydantic==2.13.5
    Scrapy==2.19.0
commands =
    # not checking tests for now
    mypy {posargs:itemadapter}

[testenv:pylint]
deps =
    pylint==4.1.2
    pylint-per-file-ignores==4.0.0
commands =
    pylint {posargs:itemadapter tests}

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true
