name: Tests

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:

permissions: {}

jobs:
  tests-ubuntu:
    name: "Test: ${{ matrix.python-version }}, Ubuntu"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC authentication with Codecov
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          env:
            TOXENV: min-attrs
        - python-version: "3.10"
          env:
            TOXENV: min-pydantic
        - python-version: "3.10"
          env:
            TOXENV: min-scrapy
        - python-version: "3.10"
          env:
            TOXENV: min-extra
        - python-version: "3.10"
          env:
            TOXENV: py
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.12"
          env:
            TOXENV: py
        - python-version: "3.13"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: attrs
        - python-version: "3.14"
          env:
            TOXENV: pydantic
        - python-version: "3.14"
          env:
            TOXENV: scrapy
        - python-version: "3.14"
          env:
            TOXENV: extra
        - python-version: "pypy3.11"
          env:
            TOXENV: py

        # pydantic1 won't support 3.14
        - python-version: "3.13"
          env:
            TOXENV: pydantic1
        - python-version: "3.13"
          env:
            TOXENV: extra-pydantic1


    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox
      run: pip install tox

    - name: Run tests
      env: ${{ matrix.env }}
      run: tox

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

  tests-other-os:
    name: "Test: py310, ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
      id-token: write  # OIDC authentication with Codecov
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"

    - name: Install tox
      run: pip install tox

    - name: Run tests
      run: tox -e py

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
